name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --publish never
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            Get-ChildItem -Path dist -Filter 'PhotoTagManager-*.exe'
            Get-ChildItem -Path dist -Filter '*.blockmap'
            Get-Item -Path dist/latest.yml
          ) | ForEach-Object { $_.FullName }
          gh release create "$env:GITHUB_REF_NAME" @assets `
            --title "PhotoTagManager $env:GITHUB_REF_NAME" `
            --generate-notes
